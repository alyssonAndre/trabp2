services:

  postgres:
    image: postgres:17
    container_name: books-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: books-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${API_PORT}:8080"

    depends_on:
      - postgres

volumes:
  postgres_data:
